# ============================================================
# HYPRLAND CONFIG — Single source of truth (no Lua)
# ============================================================
source = colors.conf

# -----------------------------------------------------------
# ENVIRONMENT
# -----------------------------------------------------------
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = DESKTOP_SESSION,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = SDL_VIDEODRIVER,wayland
env = PATH,$HOME/.local/bin:$PATH
env = PATH,$HOME/.cargo/bin:$PATH

xwayland {
    force_zero_scaling = true
}

# -----------------------------------------------------------
# MONITOR
# -----------------------------------------------------------
monitor =,preferred,auto,1

# -----------------------------------------------------------
# INPUT
# -----------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture {
    workspace_swipe = on
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = false
}

# -----------------------------------------------------------
# GENERAL
# -----------------------------------------------------------
general {
    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = $primary $on_primary 90deg
    col.inactive_border = $on_primary
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# -----------------------------------------------------------
# DECORATION
# -----------------------------------------------------------
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    rounding_power = 2

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = on
        xray = true
        vibrancy = 0.1696
    }
}

# -----------------------------------------------------------
# ANIMATIONS
# -----------------------------------------------------------
animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

# -----------------------------------------------------------
# LAYOUT & MISC
# -----------------------------------------------------------
dwindle {
    preserve_split = true
}

master {
    # new_status = master
}

binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
    initial_workspace_tracking = 1
    on_focus_under_fullscreen = 1
    allow_session_lock_restore = true
}

# -----------------------------------------------------------
# WINDOW RULES
# -----------------------------------------------------------
windowrule = float, ^(.*pavucontrol.*)$
windowrule = center, ^(.*pavucontrol.*)$
windowrule = size 700 600, ^(.*pavucontrol.*)$

windowrule = float, ^(.*waypaper.*)$
windowrule = center, ^(.*waypaper.*)$
windowrule = pin, ^(.*waypaper.*)$
windowrule = size 900 700, ^(.*waypaper.*)$

windowrule = float, ^(io.github.qwersyk.Newelle)$
windowrule = center, ^(io.github.qwersyk.Newelle)$
windowrule = pin, ^(io.github.qwersyk.Newelle)$
windowrule = size 1000 700, ^(io.github.qwersyk.Newelle)$

windowrule = float, ^(blueman-manager)$
windowrule = center, ^(blueman-manager)$
windowrule = size 800 600, ^(blueman-manager)$

windowrule = float, ^(nwg-look)$
windowrule = center, ^(nwg-look)$
windowrule = size 700 600, ^(nwg-look)$

windowrule = float, ^(nwg-displays)$
windowrule = center, ^(nwg-displays)$
windowrule = size 900 600, ^(nwg-displays)$

windowrule = float, ^(io.missioncenter.MissionCenter)$
windowrule = center, ^(io.missioncenter.MissionCenter)$
windowrule = pin, ^(io.missioncenter.MissionCenter)$
windowrule = size 900 600, ^(io.missioncenter.MissionCenter)$

windowrule = float, ^(org.gnome.Calculator)$
windowrule = center, ^(org.gnome.Calculator)$
windowrule = size 700 600, ^(org.gnome.Calculator)$

windowrule = float, ^(hyprland-share-picker)$
windowrule = center, ^(hyprland-share-picker)$
windowrule = pin, ^(hyprland-share-picker)$
windowrule = size 600 400, ^(hyprland-share-picker)$

windowrule = float, ^(xdg-desktop-portal-gtk)$
windowrule = size 800 600, ^(xdg-desktop-portal-gtk)$

windowrule = float, ^(nm-connection-editor)$
windowrule = center, ^(nm-connection-editor)$
windowrule = size 800 700, ^(nm-connection-editor)$

windowrule = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = nofocus, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# -----------------------------------------------------------
# KEYBINDINGS
# -----------------------------------------------------------
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, dolphin
bind = $mainMod, SPACE, exec, rofi -show drun -show-icons -config ~/.config/rofi/config.rasi
bind = $mainMod, V, exec, bash -c 'cliphist list | rofi -dmenu -theme ~/.config/rofi/config-cliphist.rasi -p "Clipboard" | cliphist decode | wl-copy'
bind = $mainMod, CTRL, E, exec, rofi -show emoji
bind = $mainMod, CTRL, C, exec, gnome-calculator

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Window management
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/killactive.sh
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/toggleallfloat.sh
bind = $mainMod ALT, T, togglefloating,; pin
bind = $mainMod, J, togglesplit,
bind = $mainMod, G, togglegroup,
bind = $mainMod, K, swapsplit,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, mouse:272, movewindow
bind = $mainMod, mouse:273, resizewindow

# Resize
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

# Swap windows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh

# Actions
bind = $mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod ALT, F, exec, ~/.config/hypr/scripts/screenshot.sh --instant
bind = $mainMod ALT, S, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = $mainMod ALT, A, exec, ~/.config/hypr/scripts/text-extractor.sh
bind = $mainMod CTRL, P, exec, ~/.config/hypr/scripts/power.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh --random
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/wallpaper-automation.sh
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, A, exec, ~/.config/hypr/scripts/toggle-animations.sh
bind = $mainMod CTRL, K, exec, ~/.config/hypr/scripts/keybindings.sh
bind = $mainMod SHIFT, B, exec, killall -USR2 waybar
bind = $mainMod CTRL, B, exec, killall waybar 2>/dev/null; sleep 0.3; waybar
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/loadconfig.sh
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh
bind = $mainMod ALT, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/toggle-hyprsunset.sh

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Multimedia keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous

# -----------------------------------------------------------
# AUTOSTART
# -----------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user stop xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal
exec-once = awww-daemon
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = ~/.config/hypr/scripts/init-wallpaper.sh
exec-once = ~/.config/waybar/launch.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaync
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/hypr/scripts/gtk.sh
exec-once = ~/.config/hypr/scripts/cleanup.sh
